<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
  </defs>

  <!-- Base RAM Module Board -->
  <rect x="18" y="24" width="92" height="80" rx="8" fill="url(#chipGrad)" stroke="#34495e" stroke-width="2"/>

  <!-- RAM Pins (Bottom) -->
  <g fill="#f1c40f">
    <rect x="24" y="104" width="4" height="6" rx="1"/>
    <rect x="32" y="104" width="4" height="6" rx="1"/>
    <rect x="40" y="104" width="4" height="6" rx="1"/>
    <rect x="48" y="104" width="4" height="6" rx="1"/>
    <rect x="56" y="104" width="4" height="6" rx="1"/>
    <rect x="68" y="104" width="4" height="6" rx="1"/>
    <rect x="76" y="104" width="4" height="6" rx="1"/>
    <rect x="84" y="104" width="4" height="6" rx="1"/>
    <rect x="92" y="104" width="4" height="6" rx="1"/>
    <rect x="100" y="104" width="4" height="6" rx="1"/>
  </g>

  <!-- Memory IC Chips -->
  <rect x="26" y="34" width="20" height="24" rx="2" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="54" y="34" width="20" height="24" rx="2" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="82" y="34" width="20" height="24" rx="2" fill="#111827" stroke="#374151" stroke-width="1.5"/>

  <!-- Memory Gauge / Dynamic Optimization Graphic -->
  <circle cx="64" cy="78" r="22" fill="#111827" stroke="#34495e" stroke-width="2"/>
  <path d="M 46 78 A 18 18 0 0 1 82 78" fill="none" stroke="url(#circuitGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Reduction Downward Arrow -->
  <path d="M 64 66 L 64 86 M 56 80 L 64 88 L 72 80" fill="none" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
