[workspace]
resolver = "2"
members = [
    "crates/memreduct-core",
    "crates/memreductd",
    "crates/memreduct-cli",
    "crates/memreduct-gui",
]

[workspace.package]
version = "0.1.0"
authors = ["memreduct-linux contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/memreduct-linux/memreduct-linux"

[workspace.dependencies]
memreduct-core = { path = "crates/memreduct-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
